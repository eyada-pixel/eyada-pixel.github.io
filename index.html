<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>عيادة التأهيل - v5 Final</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script async src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"></script>
  <script async src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"></script>
</head>
<body dir="rtl" style="font-family: 'Tajawal', sans-serif; background: #f6f8fc; margin: 0;">
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB3WLRLY5ZKn0TDG55uu7frulpEmj_tze0",
      authDomain: "eyada-tabiei.firebaseapp.com",
      projectId: "eyada-tabiei",
      storageBucket: "eyada-tabiei.firebasestorage.app",
      messagingSenderId: "58203582971",
      appId: "1:58203582971:web:6fc58bb0c5573c38f35b5e",
      measurementId: "G-K06GGML6EF"
    };

    let db = null;

    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();

    const { useState, useEffect, useRef } = React;

    const daysMap = {
      6: "السبت",
      0: "الأحد",
      1: "الاثنين",
      2: "الثلاثاء",
      3: "الأربعاء",
      4: "الخميس",
      5: "الجمعة (عطلة)"
    };

    const daysOrder = [6, 0, 1, 2, 3, 4];
    const injuryTypes = ["خشونة ركبة", "انزلاق غضروفي", "جلطة", "قطع رباط", "كسر", "تأهيل بعد عملية", "شد عضلي", "أخرى"];

    function App() {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [code, setCode] = useState("");
      const [error, setError] = useState("");
      const [rememberMe, setRememberMe] = useState(false);
      const [tab, setTab] = useState("today-sessions");
      const [alert, setAlert] = useState(null);
      const [loading, setLoading] = useState(true);
      const [schedules, setSchedules] = useState([]);
      const [patients, setPatients] = useState([]);
      const [therapists, setTherapists] = useState([]);
      const [newPatient, setNewPatient] = useState({
        name: "",
        phone: "",
        gender: "ذكر",
        age: "",
        address: "",
        injury_type: "",
        therapist_name: ""
      });
      const [selectedDays, setSelectedDays] = useState([]);
      const [sessionTimes, setSessionTimes] = useState({
        6: "09:00", 0: "09:00", 1: "09:00", 2: "09:00", 3: "09:00", 4: "09:00"
      });
      const alertRef = useRef(null);

      // ✅ حفظ وتحميل تسجيل الدخول من LocalStorage
      useEffect(() => {
        const saved = localStorage.getItem("eyada_clinic_login");
        if (saved) {
          const data = JSON.parse(saved);
          if (data.code === "0772") {
            setIsLoggedIn(true);
            setCode(data.code);
          }
        }
      }, []);

      const handleLogin = () => {
        if (code === "0772") {
          setIsLoggedIn(true);
          if (rememberMe) {
            localStorage.setItem("eyada_clinic_login", JSON.stringify({ 
              code, 
              timestamp: new Date().getTime() 
            }));
          }
          setError("");
        } else {
          setError("كود الدخول غير صحيح");
        }
      };

      const handleLogout = () => {
        setIsLoggedIn(false);
        localStorage.removeItem("eyada_clinic_login");
        setCode("");
      };

      const showAlert = (msg, type = "info") => {
        setAlert({ msg, type });
        if (alertRef.current) clearTimeout(alertRef.current);
        alertRef.current = setTimeout(() => setAlert(null), 4000);
      };

      // ✅ جلب البيانات من Firestore
      useEffect(() => {
        if (!isLoggedIn || !db) return;

        const fetchData = async () => {
          try {
            const schedulesSnap = await db.collection("schedules").get();
            const patientsSnap = await db.collection("patients").get();
            const therapistsSnap = await db.collection("therapists").get();

            setSchedules(schedulesSnap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
            setPatients(patientsSnap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
            setTherapists(therapistsSnap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
          } catch (err) {
            console.error("خطأ في جلب البيانات:", err);
            showAlert("خطأ في جلب البيانات", "error");
          } finally {
            setLoading(false);
          }
        };

        fetchData();
      }, [isLoggedIn]);

      // ✅ شاشة تسجيل الدخول
      if (!isLoggedIn) {
        return React.createElement("div", {
          dir: "rtl",
          className: "min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-slate-100 p-4",
        },
          React.createElement("div", { className: "w-full max-w-sm bg-white rounded-[24px] shadow-2xl p-8 border border-slate-200" },
            React.createElement("div", { className: "text-center mb-8" },
              React.createElement("div", { className: "w-16 h-16 bg-gradient-to-br from-blue-600 to-blue-700 rounded-2xl flex items-center justify-center mx-auto mb-4 text-white font-bold text-2xl shadow-lg" }, "ع"),
              React.createElement("h1", { className: "text-2xl font-bold text-slate-800" }, "عيادة التأهيل"),
              React.createElement("p", { className: "text-sm text-slate-500 mt-2" }, "النسخة الخامسة - جلسات اليوم + حجز أسبوعي")
            ),
            React.createElement("div", { className: "space-y-4" },
              React.createElement("div", {},
                React.createElement("label", { className: "text-sm font-medium text-slate-700 block mb-2" }, "كود الدخول"),
                React.createElement("input", {
                  value: code,
                  onChange: (e) => setCode(e.target.value),
                  onKeyDown: (e) => e.key === "Enter" && handleLogin(),
                  placeholder: "0772",
                  className: "w-full h-12 px-4 rounded-xl border-2 border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none text-center text-lg tracking-widest transition"
                })
              ),
              error && React.createElement("p", { className: "text-red-600 text-sm font-medium text-center" }, "❌ " + error),
              React.createElement("label", { className: "flex items-center gap-3 text-sm cursor-pointer" },
                React.createElement("input", {
                  type: "checkbox",
                  checked: rememberMe,
                  onChange: (e) => setRememberMe(e.target.checked),
                  className: "w-4 h-4 rounded cursor-pointer"
                }),
                React.createElement("span", { className: "text-slate-700" }, "تذكرني في المرات القادمة")
              ),
              React.createElement("button", {
                onClick: handleLogin,
                className: "w-full h-12 bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white rounded-xl font-bold text-[15px] transition shadow-lg"
              }, "🔓 دخول")
            )
          )
        );
      }

      // ✅ حساب جلسات اليوم
      const getTodayDate = () => new Date().toISOString().split("T")[0];
      const getTodaySessionsSorted = () => {
        return schedules
          .filter(s => s.date === getTodayDate())
          .sort((a, b) => (a.time || "00:00").localeCompare(b.time || "00:00"));
      };

      const getSessionsByTherapist = () => {
        const sessions = getTodaySessionsSorted();
        const grouped = {};
        sessions.forEach(s => {
          if (!grouped[s.therapistName]) grouped[s.therapistName] = [];
          grouped[s.therapistName].push(s);
        });
        return grouped;
      };

      const todaySessions = getTodaySessionsSorted();
      const sessionsByTherapist = getSessionsByTherapist();
      const totalRevenue = todaySessions.reduce((sum, s) => sum + (Number(s.price) || 0), 0);
      const paidRevenue = todaySessions.filter(s => s.paid).reduce((sum, s) => sum + (Number(s.price) || 0), 0);
      const unpaidRevenue = totalRevenue - paidRevenue;

      // ✅ إضافة مراجع جديد
      const handleAddPatient = async () => {
        if (!newPatient.name || !newPatient.phone) {
          showAlert("الاسم والموبايل مطلوبان", "error");
          return;
        }

        if (selectedDays.length === 0) {
          showAlert("اختر أيام الحجز على الأقل", "error");
          return;
        }

        try {
          // إضافة المريض
          const patientRef = await db.collection("patients").add({
            name: newPatient.name,
            phone: newPatient.phone,
            gender: newPatient.gender,
            age: newPatient.age,
            address: newPatient.address,
            injury_type: newPatient.injury_type,
            therapistName: newPatient.therapist_name,
            createdAt: new Date()
          });

          // إضافة الجلسات الأسبوعية
          const today = new Date();
          const schedulePromises = [];

          for (let i = 0; i < 12; i++) { // 12 أسبوع
            const date = new Date(today);
            date.setDate(date.getDate() + i * 7);

            for (const dayNum of selectedDays) {
              const sessionDate = new Date(date);
              const currentDay = sessionDate.getDay();
              const diff = dayNum - currentDay;
              sessionDate.setDate(sessionDate.getDate() + diff);

              const dateStr = sessionDate.toISOString().split("T")[0];

              schedulePromises.push(
                db.collection("schedules").add({
                  patientName: newPatient.name,
                  patientPhone: newPatient.phone,
                  therapistName: newPatient.therapist_name,
                  date: dateStr,
                  time: sessionTimes[dayNum],
                  status: "قادمة",
                  paid: false,
                  price: "",
                  injury_type: newPatient.injury_type,
                  createdAt: new Date()
                })
              );
            }
          }

          await Promise.all(schedulePromises);
          showAlert(`✅ تم إضافة ${newPatient.name} مع ${schedulePromises.length} جلسة أسبوعية`, "success");

          // إعادة تعيين النموذج
          setNewPatient({ name: "", phone: "", gender: "ذكر", age: "", address: "", injury_type: "", therapist_name: "" });
          setSelectedDays([]);

          // إعادة جلب البيانات
          const schedulesSnap = await db.collection("schedules").get();
          const patientsSnap = await db.collection("patients").get();
          setSchedules(schedulesSnap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
          setPatients(patientsSnap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        } catch (err) {
          console.error("خطأ:", err);
          showAlert("خطأ في إضافة المريض", "error");
        }
      };

      // ✅ تحديث حالة الدفع
      const updatePaidStatus = async (sessionId, isPaid) => {
        try {
          await db.collection("schedules").doc(sessionId).update({ paid: !isPaid });
          setSchedules(schedules.map(s => s.id === sessionId ? { ...s, paid: !isPaid } : s));
          showAlert("تم تحديث حالة الدفع", "success");
        } catch (err) {
          showAlert("خطأ في التحديث", "error");
        }
      };

      // ✅ الواجهة الرئيسية
      return React.createElement("div", { dir: "rtl", className: "min-h-screen bg-[#f6f8fc]" },
        // ✅ الـ Header
        React.createElement("header", { className: "sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm" },
          React.createElement("div", { className: "max-w-[1280px] mx-auto px-4 h-16 flex items-center justify-between" },
            React.createElement("div", { className: "flex items-center gap-3" },
              React.createElement("div", { className: "w-10 h-10 bg-gradient-to-br from-blue-600 to-blue-700 rounded-xl flex items-center justify-center text-white font-bold text-lg" }, "ع"),
              React.createElement("div", {},
                React.createElement("div", { className: "font-bold text-[15px] text-slate-800" }, "لوحة تحكم عيادة التأهيل"),
                React.createElement("div", { className: "text-[10px] text-slate-500" }, "v5 Final - جلسات اليوم + حجز أسبوعي + حفظ الدخول")
              )
            ),
            React.createElement("div", { className: "flex items-center gap-3" },
              React.createElement("span", { className: "text-[12px] text-slate-500" }, `📊 ${schedules.length} جلسة | 👥 ${patients.length} مريض`),
              React.createElement("button", { onClick: handleLogout, className: "h-9 px-4 rounded-full bg-red-100 text-red-700 text-[12px] font-bold hover:bg-red-200 transition" }, "🚪 خروج")
            )
          )
        ),

        // ✅ التبويبات
        React.createElement("div", { className: "sticky top-16 z-20 bg-white border-b border-slate-200" },
          React.createElement("div", { className: "max-w-[1280px] mx-auto px-4 flex gap-2 overflow-x-auto scrollbar-hide" },
            [
              { id: "today-sessions", label: "🕐 جلسات اليوم", icon: "📅" },
              { id: "add-patient", label: "➕ إضافة مراجع", icon: "🆕" },
              { id: "patients-list", label: "👥 المراجعين", icon: "📋" },
              { id: "therapists", label: "👨‍⚕️ الكادر", icon: "💼" },
              { id: "reports", label: "📊 التقارير", icon: "📈" }
            ].map(t =>
              React.createElement("button", {
                key: t.id,
                onClick: () => setTab(t.id),
                className: `h-12 px-4 whitespace-nowrap border-b-2 text-[13px] font-medium transition ${
                  tab === t.id
                    ? "border-b-blue-600 text-blue-600 bg-blue-50/50"
                    : "border-b-transparent text-slate-600 hover:text-slate-800"
                }`
              }, t.label)
            )
          )
        ),

        // ✅ رسالة التنبيه
        alert && React.createElement("div", {
          className: `fixed z-50 top-20 left-1/2 -translate-x-1/2 px-5 py-3 rounded-2xl shadow-xl text-[13px] font-bold backdrop-blur ${
            alert.type === "error" ? "bg-red-600/90 text-white" :
            alert.type === "success" ? "bg-emerald-600/90 text-white" :
            "bg-blue-600/90 text-white"
          }`
        }, alert.msg),

        // ✅ المحتوى
        React.createElement("main", { className: "max-w-[1280px] mx-auto p-4 pb-10" },
          // ✅ صفحة جلسات اليوم
          tab === "today-sessions" && React.createElement("div", { className: "space-y-4" },
            // الإحصائيات
            React.createElement("div", { className: "grid grid-cols-1 md:grid-cols-4 gap-3" },
              React.createElement("div", { className: "bg-white rounded-2xl border border-blue-200 p-5 shadow-sm" },
                React.createElement("div", { className: "text-[11px] text-blue-600 font-bold" }, "🕐 جلسات اليوم"),
                React.createElement("div", { className: "text-3xl font-bold text-blue-600 mt-2" }, todaySessions.length),
                React.createElement("div", { className: "text-[10px] text-slate-500 mt-1" }, new Date().toLocaleDateString("ar-EG"))
              ),
              React.createElement("div", { className: "bg-white rounded-2xl border border-slate-200 p-5 shadow-sm" },
                React.createElement("div", { className: "text-[11px] text-slate-600 font-bold" }, "💰 مجموع الإيرادات"),
                React.createElement("div", { className: "text-3xl font-bold text-slate-800 mt-2" }, totalRevenue),
                React.createElement("div", { className: "text-[10px] text-slate-500 mt-1" }, "د.ع")
              ),
              React.createElement("div", { className: "bg-white rounded-2xl border border-emerald-200 p-5 shadow-sm" },
                React.createElement("div", { className: "text-[11px] text-emerald-600 font-bold" }, "✅ المدفوع"),
                React.createElement("div", { className: "text-3xl font-bold text-emerald-600 mt-2" }, paidRevenue),
                React.createElement("div", { className: "text-[10px] text-slate-500 mt-1" }, `${todaySessions.filter(s => s.paid).length} جلسة`)
              ),
              React.createElement("div", { className: "bg-white rounded-2xl border border-red-200 p-5 shadow-sm" },
                React.createElement("div", { className: "text-[11px] text-red-600 font-bold" }, "❌ غير المدفوع"),
                React.createElement("div", { className: "text-3xl font-bold text-red-600 mt-2" }, unpaidRevenue),
                React.createElement("div", { className: "text-[10px] text-slate-500 mt-1" }, `${todaySessions.filter(s => !s.paid).length} جلسة`)
              )
            ),

            // جلسات اليوم حسب المعالج
            todaySessions.length > 0 ?
              React.createElement("div", { className: "grid grid-cols-1 md:grid-cols-2 gap-4" },
                Object.keys(sessionsByTherapist).sort().map(therapistName =>
                  React.createElement("div", { key: therapistName, className: "bg-white rounded-[20px] border border-slate-200 p-5 shadow-sm" },
                    React.createElement("div", { className: "flex items-center justify-between mb-4" },
                      React.createElement("h3", { className: "font-bold text-[14px] text-blue-600" }, `👨‍⚕️ ${therapistName}`),
                      React.createElement("span", { className: "bg-blue-100 text-blue-700 text-[11px] font-bold px-2.5 py-1 rounded-full" }, `${sessionsByTherapist[therapistName].length} جلسة`)
                    ),
                    React.createElement("div", { className: "space-y-2.5" },
                      sessionsByTherapist[therapistName].map(session =>
                        React.createElement("div", { key: session.id, className: "p-3.5 rounded-xl border border-slate-200 bg-gradient-to-r from-slate-50 to-blue-50/30 hover:border-blue-300 transition" },
                          React.createElement("div", { className: "flex justify-between items-start gap-2" },
                            React.createElement("div", { className: "flex-1" },
                              React.createElement("div", { className: "font-bold text-[13px] text-slate-800" }, session.patientName),
                              React.createElement("div", { className: "text-[11px] text-slate-500 mt-1 flex items-center gap-1" }, `🕐 ${session.time || "بدون وقت"}  •  ☎️ ${session.patientPhone}`),
                              React.createElement("div", { className: "text-[11px] text-slate-600 mt-1" }, `📍 ${session.injury_type || "-"}`)
                            ),
                            React.createElement("button", {
                              onClick: () => updatePaidStatus(session.id, session.paid),
                              className: `px-3 py-1.5 rounded-full text-[11px] font-bold transition ${
                                session.paid
                                  ? "bg-emerald-600 text-white hover:bg-emerald-700"
                                  : "bg-red-600 text-white hover:bg-red-700"
                              }`
                            }, session.paid ? "✓ مدفوع" : "✗ غير مدفوع")
                          ),
                          session.price && React.createElement("div", { className: "text-[12px] font-bold text-blue-600 mt-2.5" }, `💰 ${session.price} د.ع`)
                        )
                      )
                    )
                  )
                )
              )
              :
              React.createElement("div", { className: "bg-white rounded-[20px] border-2 border-dashed border-slate-300 p-12 text-center" },
                React.createElement("div", { className: "text-5xl mb-3" }, "😊"),
                React.createElement("div", { className: "text-[15px] font-bold text-slate-700" }, "لا توجد جلسات اليوم"),
                React.createElement("div", { className: "text-[12px] text-slate-500 mt-2" }, "يوم هادئ في العيادة!")
              )
          ),

          // ✅ صفحة إضافة مراجع
          tab === "add-patient" && React.createElement("div", { className: "grid grid-cols-1 lg:grid-cols-[1.2fr_0.8fr] gap-4" },
            // فورم الإضافة
            React.createElement("div", { className: "bg-white rounded-[20px] border border-slate-200 p-6 shadow-sm" },
              React.createElement("h2", { className: "font-bold text-[16px] text-slate-800 mb-4" }, "➕ إضافة مريض جديد مع جلسات أسبوعية"),
              React.createElement("div", { className: "space-y-4" },
                React.createElement("div", { className: "grid grid-cols-1 md:grid-cols-2 gap-3" },
                  React.createElement("div", {},
                    React.createElement("label", { className: "text-[12px] font-bold text-slate-700" }, "الاسم"),
                    React.createElement("input", {
                      value: newPatient.name,
                      onChange: (e) => setNewPatient({ ...newPatient, name: e.target.value }),
                      placeholder: "أحمد محمد",
                      className: "mt-1 w-full h-10 px-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none text-[13px]"
                    })
                  ),
                  React.createElement("div", {},
                    React.createElement("label", { className: "text-[12px] font-bold text-slate-700" }, "الموبايل"),
                    React.createElement("input", {
                      value: newPatient.phone,
                      onChange: (e) => setNewPatient({ ...newPatient, phone: e.target.value }),
                      placeholder: "0770xxxxxxx",
                      className: "mt-1 w-full h-10 px-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none text-[13px] dir-ltr",
                      style: { direction: "ltr" }
                    })
                  )
                ),
                React.createElement("div", { className: "grid grid-cols-2 gap-3" },
                  React.createElement("div", {},
                    React.createElement("label", { className: "text-[12px] font-bold text-slate-700" }, "الجنس"),
                    React.createElement("select", {
                      value: newPatient.gender,
                      onChange: (e) => setNewPatient({ ...newPatient, gender: e.target.value }),
                      className: "mt-1 w-full h-10 px-3 rounded-xl border border-slate-200 text-[13px]"
                    },
                      React.createElement("option", {}, "ذكر"),
                      React.createElement("option", {}, "أنثى")
                    )
                  ),
                  React.createElement("div", {},
                    React.createElement("label", { className: "text-[12px] font-bold text-slate-700" }, "العمر"),
                    React.createElement("input", {
                      type: "number",
                      value: newPatient.age,
                      onChange: (e) => setNewPatient({ ...newPatient, age: e.target.value }),
                      placeholder: "35",
                      className: "mt-1 w-full h-10 px-3 rounded-xl border border-slate-200 text-[13px]"
                    })
                  )
                ),
                React.createElement("div", {},
                  React.createElement("label", { className: "text-[12px] font-bold text-slate-700" }, "العنوان"),
                  React.createElement("input", {
                    value: newPatient.address,
                    onChange: (e) => setNewPatient({ ...newPatient, address: e.target.value }),
                    placeholder: "بغداد - الكرادة",
                    className: "mt-1 w-full h-10 px-3 rounded-xl border border-slate-200 text-[13px]"
                  })
                ),
                React.createElement("div", {},
                  React.createElement("label", { className: "text-[12px] font-bold text-slate-700" }, "نوع الإصابة"),
                  React.createElement("select", {
                    value: newPatient.injury_type,
                    onChange: (e) => setNewPatient({ ...newPatient, injury_type: e.target.value }),
                    className: "mt-1 w-full h-10 px-3 rounded-xl border border-slate-200 text-[13px]"
                  },
                    React.createElement("option", { value: "" }, "اختر..."),
                    injuryTypes.map(type => React.createElement("option", { key: type, value: type }, type))
                  )
                ),
                React.createElement("div", {},
                  React.createElement("label", { className: "text-[12px] font-bold text-slate-700" }, "المعالج"),
                  React.createElement("select", {
                    value: newPatient.therapist_name,
                    onChange: (e) => setNewPatient({ ...newPatient, therapist_name: e.target.value }),
                    className: "mt-1 w-full h-10 px-3 rounded-xl border border-slate-200 text-[13px]"
                  },
                    React.createElement("option", { value: "" }, "اختر معالج..."),
                    therapists.map(t => React.createElement("option", { key: t.id, value: t.name }, t.name))
                  )
                )
              )
            ),

            // اختيار أيام الحجز
            React.createElement("div", { className: "bg-white rounded-[20px] border border-slate-200 p-6 shadow-sm h-fit" },
              React.createElement("h3", { className: "font-bold text-[14px] text-slate-800 mb-4" }, "📅 أيام الحجز الأسبوعية"),
              React.createElement("div", { className: "space-y-2" },
                daysOrder.map(day =>
                  React.createElement("label", { key: day, className: `p-3 rounded-xl border-2 flex items-center gap-3 cursor-pointer transition ${
                    selectedDays.includes(day)
                      ? "border-blue-600 bg-blue-50"
                      : "border-slate-200 bg-white hover:border-slate-300"
                  }` },
                    React.createElement("input", {
                      type: "checkbox",
                      checked: selectedDays.includes(day),
                      onChange: (e) => {
                        if (e.target.checked) {
                          setSelectedDays([...selectedDays, day]);
                        } else {
                          setSelectedDays(selectedDays.filter(d => d !== day));
                        }
                      },
                      disabled: day === 5,
                      className: "w-4 h-4 cursor-pointer"
                    }),
                    React.createElement("div", { className: "flex-1" },
                      React.createElement("span", { className: "font-bold text-[13px] text-slate-800" }, daysMap[day]),
                      day !== 5 && React.createElement("input", {
                        type: "time",
                        value: sessionTimes[day],
                        onChange: (e) => setSessionTimes({ ...sessionTimes, [day]: e.target.value }),
                        className: "mt-1 w-full h-8 px-2 rounded-lg border border-slate-200 text-[12px]"
                      })
                    )
                  )
                )
              ),
              React.createElement("div", { className: "mt-4 p-3 rounded-xl bg-red-50 border border-red-200 text-[11px] text-red-700" },
                "⚠️ الجمعة عطلة العيادة - لا يمكن الحجز"
              ),
              React.createElement("button", {
                onClick: handleAddPatient,
                disabled: !newPatient.name || !newPatient.phone || selectedDays.length === 0,
                className: "mt-6 w-full h-11 bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 disabled:from-slate-300 disabled:to-slate-400 text-white rounded-xl font-bold text-[13px] transition shadow-lg"
              }, "✅ حفظ المريض والجلسات")
            )
          ),

          // ✅ صفحة المراجعين
          tab === "patients-list" && React.createElement("div", { className: "bg-white rounded-[20px] border border-slate-200 p-6" },
            React.createElement("h2", { className: "font-bold text-[16px] text-slate-800 mb-4" }, `👥 المراجعين (${patients.length})`),
            React.createElement("div", { className: "grid grid-cols-1 md:grid-cols-2 gap-4" },
              patients.map(patient =>
                React.createElement("div", { key: patient.id, className: "p-4 rounded-2xl border border-slate-200 hover:border-blue-300 transition" },
                  React.createElement("div", { className: "font-bold text-[13px] text-slate-800" }, patient.name),
                  React.createElement("div", { className: "text-[11px] text-slate-500 mt-1" }, `📱 ${patient.phone}`),
                  React.createElement("div", { className: "text-[11px] text-slate-500" }, `📍 ${patient.address || "-"}`),
                  React.createElement("div", { className: "text-[11px] text-slate-500" }, `⚕️ ${patient.therapistName || "-"}`)
                )
              )
            )
          ),

          // ✅ صفحة الكادر
          tab === "therapists" && React.createElement("div", { className: "bg-white rounded-[20px] border border-slate-200 p-6" },
            React.createElement("h3", { className: "font-bold text-[14px] text-slate-800 mb-4" }, `👨‍⚕️ الكادر (${therapists.length})`),
            React.createElement("div", { className: "grid grid-cols-1 md:grid-cols-3 gap-3" },
              therapists.map(t =>
                React.createElement("div", { key: t.id, className: "p-4 rounded-2xl border border-slate-200" },
                  React.createElement("div", { className: "font-bold text-[13px] text-slate-800" }, t.name),
                  React.createElement("div", { className: "text-[11px] text-slate-500 mt-1" }, t.phone || "-"),
                  React.createElement("div", { className: "text-[11px] text-slate-500" }, t.specialization || "-")
                )
              )
            )
          ),

          // ✅ صفحة التقارير
          tab === "reports" && React.createElement("div", { className: "grid grid-cols-1 md:grid-cols-2 gap-4" },
            React.createElement("div", { className: "bg-white rounded-[20px] border border-slate-200 p-6" },
              React.createElement("h3", { className: "font-bold text-[14px] text-slate-800 mb-4" }, "📊 إحصائيات عامة"),
              React.createElement("div", { className: "space-y-3" },
                React.createElement("div", { className: "p-3 rounded-xl bg-slate-50 border" },
                  React.createElement("div", { className: "text-[11px] text-slate-500" }, "مجموع الجلسات"),
                  React.createElement("div", { className: "text-2xl font-bold text-blue-600 mt-1" }, schedules.length)
                ),
                React.createElement("div", { className: "p-3 rounded-xl bg-slate-50 border" },
                  React.createElement("div", { className: "text-[11px] text-slate-500" }, "مجموع المرضى"),
                  React.createElement("div", { className: "text-2xl font-bold text-slate-800 mt-1" }, patients.length)
                ),
                React.createElement("div", { className: "p-3 rounded-xl bg-slate-50 border" },
                  React.createElement("div", { className: "text-[11px] text-slate-500" }, "الجلسات المدفوعة"),
                  React.createElement("div", { className: "text-2xl font-bold text-emerald-600 mt-1" }, schedules.filter(s => s.paid).length)
                )
              )
            ),
            React.createElement("div", { className: "bg-white rounded-[20px] border border-slate-200 p-6" },
              React.createElement("h3", { className: "font-bold text-[14px] text-slate-800 mb-4" }, "💰 الإيرادات الإجمالية"),
              React.createElement("div", { className: "space-y-3" },
                React.createElement("div", { className: "p-4 rounded-xl bg-blue-50 border border-blue-200" },
                  React.createElement("div", { className: "text-[11px] text-blue-600" }, "المبلغ الإجمالي"),
                  React.createElement("div", { className: "text-2xl font-bold text-blue-700 mt-1" }, schedules.reduce((sum, s) => sum + (Number(s.price) || 0), 0) + " د.ع")
                ),
                React.createElement("div", { className: "p-4 rounded-xl bg-emerald-50 border border-emerald-200" },
                  React.createElement("div", { className: "text-[11px] text-emerald-600" }, "المبلغ المحصل"),
                  React.createElement("div", { className: "text-2xl font-bold text-emerald-700 mt-1" }, schedules.filter(s => s.paid).reduce((sum, s) => sum + (Number(s.price) || 0), 0) + " د.ع")
                )
              )
            )
          )
        )
      );
    }

    // ✅ تحميل التطبيق
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(React.createElement(App));
  </script>
</body>
</html>
