<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>عيادة التأهيل - v6 مطور</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
</head>
<body dir="rtl" style="font-family: 'Tajawal', sans-serif; background: #f6f8fc; margin: 0;">
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>
    // --- OneSignal Init ---
    // OneSignal - معطل حتى تضع الـ App ID
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      try {
        await OneSignal.init({
          appId: "ضع هنا APP ID الخاص بك من OneSignal - لن يعمل حتى تغيره",
        });
      } catch(e){ console.log("OneSignal not configured yet", e); }
    });

    const firebaseConfig = {
      apiKey: "AIzaSyB3WLRLY5ZKn0TDG55uu7frulpEmj_tze0",
      authDomain: "eyada-tabiei.firebaseapp.com",
      projectId: "eyada-tabiei",
      storageBucket: "eyada-tabiei.firebasestorage.app",
      messagingSenderId: "58203582971",
      appId: "1:58203582971:web:6fc58bb0c5573c38f35b5e",
      measurementId: "G-K06GGML6EF"
    };

    let db = null;
    try {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
    } catch(e) { console.error(e); }

    const { useState, useEffect, useRef } = React;

    const daysMap = { 6: "السبت", 0: "الأحد", 1: "الاثنين", 2: "الثلاثاء", 3: "الأربعاء", 4: "الخميس", 5: "الجمعة (عطلة)" };
    const daysOrder = [6, 0, 1, 2, 3, 4];
    const injuryTypes = ["خشونة ركبة", "انزلاق غضروفي", "جلطة", "قطع رباط", "كسر", "تأهيل بعد عملية", "شد عضلي", "أخرى"];

    function formatToWhatsApp(phone) {
      if (!phone) return "#";
      let p = phone.replace(/\D/g, "");
      if (p.startsWith("0")) p = "964" + p.substring(1);
      if (!p.startsWith("964")) p = "964" + p;
      return `https://wa.me/${p}`;
    }

    function App() {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [code, setCode] = useState("");
      const [error, setError] = useState("");
      const [rememberMe, setRememberMe] = useState(false);
      const [tab, setTab] = useState("today-sessions");
      const [alert, setAlert] = useState(null);
      const [loading, setLoading] = useState(true);
      const [schedules, setSchedules] = useState([]);
      const [patients, setPatients] = useState([]);
      const [therapists, setTherapists] = useState([]);

      // Add Patient States
      const [newPatient, setNewPatient] = useState({ name: "", phone: "", gender: "ذكر", age_value: "", age_unit: "سنة", address: "", injury_type: "", therapist_name: "" });
      const [selectedDays, setSelectedDays] = useState([]);
      const [sessionTimes, setSessionTimes] = useState({ 6: "09:00", 0: "09:00", 1: "09:00", 2: "09:00", 3: "09:00", 4: "09:00" });

      // Therapist Add States
      const [newTherapist, setNewTherapist] = useState({ name: "", phone: "", specialization: "" });

      // Edit Patient States
      const [editingPatient, setEditingPatient] = useState(null);

      // OneSignal States
      const [notifTitle, setNotifTitle] = useState("");
      const [notifMsg, setNotifMsg] = useState("");
      const [notifTarget, setNotifTarget] = useState("all");

      const alertRef = useRef(null);

      useEffect(() => {
        try {
          const saved = localStorage.getItem("eyada_clinic_login");
          if (saved) {
            const data = JSON.parse(saved);
            if (data.code === "0772") { setIsLoggedIn(true); setCode(data.code); }
          }
        } catch(e) {}
      }, []);

      const handleLogin = () => {
        if (code === "0772") {
          setIsLoggedIn(true);
          if (rememberMe) localStorage.setItem("eyada_clinic_login", JSON.stringify({ code, timestamp: new Date().getTime() }));
          setError("");
        } else setError("كود الدخول غير صحيح");
      };
      const handleLogout = () => { setIsLoggedIn(false); localStorage.removeItem("eyada_clinic_login"); setCode(""); };
      const showAlert = (msg, type = "info") => {
        setAlert({ msg, type });
        if (alertRef.current) clearTimeout(alertRef.current);
        alertRef.current = setTimeout(() => setAlert(null), 4000);
      };

      const fetchData = async () => {
        setLoading(true);
        try {
          const [sSnap, pSnap, tSnap] = await Promise.all([
            db.collection("schedules").get(),
            db.collection("patients").get(),
            db.collection("therapists").get()
          ]);
          setSchedules(sSnap.docs.map(d => ({ id: d.id, ...d.data() })));
          setPatients(pSnap.docs.map(d => ({ id: d.id, ...d.data() })));
          setTherapists(tSnap.docs.map(d => ({ id: d.id, ...d.data() })));
        } catch (err) { showAlert("خطأ في جلب البيانات", "error"); }
        finally { setLoading(false); }
      };

      useEffect(() => { if (isLoggedIn && db) fetchData(); }, [isLoggedIn]);

      if (!isLoggedIn) {
        return React.createElement("div", { dir: "rtl", className: "min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-slate-100 p-4" },
          React.createElement("div", { className: "w-full max-w-sm bg-white rounded-[24px] shadow-2xl p-8 border border-slate-200" },
            React.createElement("div", { className: "text-center mb-8" },
              React.createElement("div", { className: "w-16 h-16 bg-gradient-to-br from-blue-600 to-blue-700 rounded-2xl flex items-center justify-center mx-auto mb-4 text-white font-bold text-2xl shadow-lg" }, "ع"),
              React.createElement("h1", { className: "text-2xl font-bold text-slate-800" }, "عيادة التأهيل"),
              React.createElement("p", { className: "text-sm text-slate-500 mt-2" }, "v6 - الكادر + تعديل + واتساب + إشعارات")
            ),
            React.createElement("div", { className: "space-y-4" },
              React.createElement("input", { value: code, onChange: (e) => setCode(e.target.value), onKeyDown: (e) => e.key === "Enter" && handleLogin(), placeholder: "0772", className: "w-full h-12 px-4 rounded-xl border-2 border-slate-200 focus:border-blue-500 outline-none text-center text-lg" }),
              error && React.createElement("p", { className: "text-red-600 text-sm text-center" }, "❌ " + error),
              React.createElement("label", { className: "flex items-center gap-3 text-sm cursor-pointer" },
                React.createElement("input", { type: "checkbox", checked: rememberMe, onChange: (e) => setRememberMe(e.target.checked) }),
                React.createElement("span", {}, "تذكرني")
              ),
              React.createElement("button", { onClick: handleLogin, className: "w-full h-12 bg-blue-600 text-white rounded-xl font-bold" }, "🔓 دخول")
            )
          )
        );
      }

      const getTodayDate = () => new Date().toISOString().split("T")[0];
      const getTodaySessionsSorted = () => schedules.filter(s => s.date === getTodayDate()).sort((a,b) => (a.time||"00:00").localeCompare(b.time||"00:00"));
      const todaySessions = getTodaySessionsSorted();
      const totalRevenue = todaySessions.reduce((sum, s) => sum + (Number(s.price)||0), 0);
      const paidRevenue = todaySessions.filter(s => s.paid).reduce((sum, s) => sum + (Number(s.price)||0), 0);
      const unpaidRevenue = totalRevenue - paidRevenue;

      // --- Actions ---
      const handleAddPatient = async () => {
        if (!newPatient.name || !newPatient.phone) { showAlert("الاسم والموبايل مطلوبان", "error"); return; }
        if (selectedDays.length === 0) { showAlert("اختر أيام الحجز", "error"); return; }
        try {
          const ageString = newPatient.age_value ? `${newPatient.age_value} ${newPatient.age_unit}` : "";
          await db.collection("patients").add({ name: newPatient.name, phone: newPatient.phone, gender: newPatient.gender, age: ageString, age_value: newPatient.age_value, age_unit: newPatient.age_unit, address: newPatient.address, injury_type: newPatient.injury_type, therapistName: newPatient.therapist_name, createdAt: new Date() });
          const today = new Date();
          const promises = [];
          for (let i=0; i<12; i++) {
            const date = new Date(today); date.setDate(date.getDate()+i*7);
            for (const dayNum of selectedDays) {
              const sd = new Date(date); sd.setDate(sd.getDate() + (dayNum - sd.getDay()));
              promises.push(db.collection("schedules").add({ patientName: newPatient.name, patientPhone: newPatient.phone, therapistName: newPatient.therapist_name, date: sd.toISOString().split("T")[0], time: sessionTimes[dayNum], status: "قادمة", paid: false, price: "", injury_type: newPatient.injury_type, createdAt: new Date() }));
            }
          }
          await Promise.all(promises);
          showAlert(`✅ تمت إضافة ${newPatient.name} مع ${promises.length} جلسة`, "success");
          setNewPatient({ name: "", phone: "", gender: "ذكر", age_value: "", age_unit: "سنة", address: "", injury_type: "", therapist_name: "" }); setSelectedDays([]);
          fetchData();
        } catch(e) { showAlert("خطأ في الإضافة", "error"); }
      };

      const handleAddTherapist = async () => {
        if (!newTherapist.name || !newTherapist.phone) { showAlert("اسم ورقم المعالج مطلوب", "error"); return; }
        try {
          await db.collection("therapists").add({ name: newTherapist.name, phone: newTherapist.phone, specialization: newTherapist.specialization, createdAt: new Date() });
          showAlert(`✅ تمت إضافة المعالج ${newTherapist.name}`, "success");
          setNewTherapist({ name: "", phone: "", specialization: "" });
          fetchData();
        } catch(e) { showAlert("خطأ في إضافة الكادر", "error"); }
      };

      const handleDeleteTherapist = async (id) => {
        if (!confirm("متأكد تريد حذف هذا المعالج؟")) return;
        await db.collection("therapists").doc(id).delete();
        setTherapists(therapists.filter(t => t.id !== id));
        showAlert("تم الحذف", "info");
      };

      const handleUpdatePatient = async () => {
        if (!editingPatient) return;
        try {
          await db.collection("patients").doc(editingPatient.id).update({ name: editingPatient.name, phone: editingPatient.phone, address: editingPatient.address, injury_type: editingPatient.injury_type, therapistName: editingPatient.therapistName, age: editingPatient.age });
          showAlert("✅ تم تحديث بيانات المراجع", "success");
          setEditingPatient(null);
          fetchData();
        } catch(e) { showAlert("خطأ في التحديث", "error"); }
      };

      const updateSession = async (id, data) => {
        await db.collection("schedules").doc(id).update(data);
        setSchedules(schedules.map(s => s.id === id ? { ...s, ...data } : s));
      };

      const handleSendNotification = async () => {
        if (!notifTitle || !notifMsg) { showAlert("اكتب عنوان ورسالة الإشعار", "error"); return; }
        try {
          // OneSignal REST API - يحتاج REST API Key من لوحة تحكم OneSignal
          // هذا مثال للارسال - ضع مفتاحك في الأسفل
          const ONESIGNAL_REST_KEY = "ضع هنا REST API KEY";
          const ONESIGNAL_APP_ID = "ضع هنا APP ID";
          
          // اذا ما عندك المفتاح، نفتح لوحة التحكم
          if (ONESIGNAL_REST_KEY.includes("ضع هنا")) {
            showAlert("⚠️ ضع مفاتيح OneSignal في الكود أولاً، سيتم فتح لوحة التحكم", "info");
            window.open("https://app.onesignal.com", "_blank");
            return;
          }

          const response = await fetch("https://onesignal.com/api/v1/notifications", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": `Basic ${ONESIGNAL_REST_KEY}` },
            body: JSON.stringify({
              app_id: ONESIGNAL_APP_ID,
              headings: { en: notifTitle, ar: notifTitle },
              contents: { en: notifMsg, ar: notifMsg },
              included_segments: notifTarget === "all" ? ["Subscribed Users"] : ["Subscribed Users"],
            })
          });
          const res = await response.json();
          if (res.id) showAlert("✅ تم إرسال الإشعار بنجاح", "success");
          else showAlert("❌ فشل الإرسال: " + JSON.stringify(res), "error");
        } catch(e) { showAlert("خطأ في الإرسال - تأكد من مفاتيح OneSignal", "error"); }
      };

      return React.createElement("div", { dir: "rtl", className: "min-h-screen bg-[#f6f8fc]" },
        React.createElement("header", { className: "sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm" },
          React.createElement("div", { className: "max-w-[1280px] mx-auto px-4 h-16 flex items-center justify-between" },
            React.createElement("div", { className: "flex items-center gap-3" },
              React.createElement("div", { className: "w-10 h-10 bg-gradient-to-br from-blue-600 to-blue-700 rounded-xl flex items-center justify-center text-white font-bold text-lg" }, "ع"),
              React.createElement("div", {},
                React.createElement("div", { className: "font-bold text-[15px] text-slate-800" }, "لوحة تحكم عيادة التأهيل"),
                React.createElement("div", { className: "text-[10px] text-slate-500" }, "v6 مطور - إضافة كادر + تعديل + واتساب + مبالغ + OneSignal")
              )
            ),
            React.createElement("div", { className: "flex items-center gap-3" },
              React.createElement("span", { className: "text-[12px] text-slate-500 hidden md:block" }, `📊 ${schedules.length} جلسة | 👥 ${patients.length} مريض | 👨⚕ ${therapists.length} كادر`),
              React.createElement("button", { onClick: handleLogout, className: "h-9 px-4 rounded-full bg-red-100 text-red-700 text-[12px] font-bold" }, "🚪 خروج")
            )
          )
        ),

        React.createElement("div", { className: "sticky top-16 z-20 bg-white border-b border-slate-200" },
          React.createElement("div", { className: "max-w-[1280px] mx-auto px-4 flex gap-2 overflow-x-auto" },
            [
              { id: "today-sessions", label: "🕐 جلسات اليوم" },
              { id: "add-patient", label: "➕ إضافة مراجع" },
              { id: "patients-list", label: "👥 المراجعين" },
              { id: "therapists", label: "👨⚕ الكادر" },
              { id: "reports", label: "📊 التقارير" },
              { id: "notifications", label: "🔔 الإشعارات" }
            ].map(t => React.createElement("button", { key: t.id, onClick: () => setTab(t.id), className: `h-12 px-4 whitespace-nowrap border-b-2 text-[13px] font-medium transition ${tab === t.id ? "border-b-blue-600 text-blue-600 bg-blue-50/50" : "border-b-transparent text-slate-600"}` }, t.label))
          )
        ),

        alert && React.createElement("div", { className: `fixed z-50 top-20 left-1/2 -translate-x-1/2 px-5 py-3 rounded-2xl shadow-xl text-[13px] font-bold backdrop-blur ${alert.type === "error" ? "bg-red-600/90 text-white" : alert.type === "success" ? "bg-emerald-600/90 text-white" : "bg-blue-600/90 text-white"}` }, alert.msg),

        React.createElement("main", { className: "max-w-[1280px] mx-auto p-4 pb-10" },
          loading && React.createElement("div", { className: "text-center py-10 text-slate-500" }, "⏳ جاري تحميل البيانات..."),

          // === جلسات اليوم - معاد هيكلته ===
          !loading && tab === "today-sessions" && React.createElement("div", { className: "space-y-4" },
            React.createElement("div", { className: "grid grid-cols-2 md:grid-cols-4 gap-3" },
              React.createElement("div", { className: "bg-white rounded-2xl border border-blue-200 p-5 shadow-sm" },
                React.createElement("div", { className: "text-[11px] text-blue-600 font-bold" }, "🕐 جلسات اليوم"),
                React.createElement("div", { className: "text-3xl font-bold text-blue-600 mt-2" }, todaySessions.length)
              ),
              React.createElement("div", { className: "bg-white rounded-2xl border border-slate-200 p-5 shadow-sm" },
                React.createElement("div", { className: "text-[11px] text-slate-600 font-bold" }, "💰 الإجمالي"),
                React.createElement("div", { className: "text-2xl font-bold text-slate-800 mt-2" }, totalRevenue.toLocaleString() + " د.ع")
              ),
              React.createElement("div", { className: "bg-white rounded-2xl border border-emerald-200 p-5 shadow-sm" },
                React.createElement("div", { className: "text-[11px] text-emerald-600 font-bold" }, "✅ مدفوع"),
                React.createElement("div", { className: "text-2xl font-bold text-emerald-600 mt-2" }, paidRevenue.toLocaleString() + " د.ع")
              ),
              React.createElement("div", { className: "bg-white rounded-2xl border border-red-200 p-5 shadow-sm" },
                React.createElement("div", { className: "text-[11px] text-red-600 font-bold" }, "❌ غير مدفوع"),
                React.createElement("div", { className: "text-2xl font-bold text-red-600 mt-2" }, unpaidRevenue.toLocaleString() + " د.ع")
              )
            ),

            // جدول منظم
            React.createElement("div", { className: "bg-white rounded-[20px] border border-slate-200 shadow-sm overflow-hidden" },
              React.createElement("div", { className: "p-5 border-b bg-slate-50 flex justify-between items-center" },
                React.createElement("h3", { className: "font-bold text-[14px]" }, `📅 جدول جلسات اليوم - ${new Date().toLocaleDateString("ar-EG")}`),
                React.createElement("span", { className: "text-[11px] bg-blue-100 text-blue-700 px-3 py-1 rounded-full font-bold" }, `${todaySessions.length} جلسة مرتبة حسب الوقت`)
              ),
              todaySessions.length > 0 ?
              React.createElement("div", { className: "overflow-x-auto" },
                React.createElement("table", { className: "w-full text-[13px]" },
                  React.createElement("thead", { className: "bg-slate-100 text-slate-600 text-[11px]" },
                    React.createElement("tr", {},
                      React.createElement("th", { className: "p-3 text-right" }, "🕐 الوقت"),
                      React.createElement("th", { className: "p-3 text-right" }, "👤 المراجع"),
                      React.createElement("th", { className: "p-3 text-right" }, "👨⚕ المعالج"),
                      React.createElement("th", { className: "p-3 text-right" }, "📋 الحالة"),
                      React.createElement("th", { className: "p-3 text-right" }, "💰 المبلغ (د.ع)"),
                      React.createElement("th", { className: "p-3 text-right" }, "💳 الدفع"),
                      React.createElement("th", { className: "p-3 text-right" }, "📱 تواصل")
                    )
                  ),
                  React.createElement("tbody", {},
                    todaySessions.map(s => 
                      React.createElement("tr", { key: s.id, className: "border-t hover:bg-blue-50/50 transition" },
                        React.createElement("td", { className: "p-3 font-bold text-blue-600" }, s.time || "--:--"),
                        React.createElement("td", { className: "p-3" },
                          React.createElement("div", { className: "font-bold text-slate-800" }, s.patientName),
                          React.createElement("div", { className: "text-[11px] text-slate-500" }, s.injury_type || "-")
                        ),
                        React.createElement("td", { className: "p-3 text-slate-700" }, s.therapistName || "-"),
                        React.createElement("td", { className: "p-3" },
                          React.createElement("select", {
                            value: s.status || "قادمة",
                            onChange: (e) => updateSession(s.id, { status: e.target.value }),
                            className: `text-[11px] px-2 py-1 rounded-full border font-bold ${s.status === "مكتملة" ? "bg-emerald-100 text-emerald-700 border-emerald-200" : s.status === "ملغاة" ? "bg-red-100 text-red-700 border-red-200" : "bg-amber-100 text-amber-700 border-amber-200"}`
                          },
                            React.createElement("option", {}, "قادمة"),
                            React.createElement("option", {}, "مكتملة"),
                            React.createElement("option", {}, "ملغاة")
                          )
                        ),
                        React.createElement("td", { className: "p-3" },
                          React.createElement("div", { className: "flex items-center gap-1" },
                            React.createElement("input", {
                              type: "number",
                              placeholder: "0",
                              defaultValue: s.price,
                              onBlur: (e) => { if (e.target.value !== s.price) updateSession(s.id, { price: e.target.value }); },
                              className: "w-24 h-8 px-2 rounded-lg border border-slate-200 text-[12px] focus:border-blue-500 outline-none"
                            }),
                            React.createElement("span", { className: "text-[10px] text-slate-500" }, "د.ع")
                          )
                        ),
                        React.createElement("td", { className: "p-3" },
                          React.createElement("button", { onClick: () => updateSession(s.id, { paid: !s.paid }), className: `px-3 py-1 rounded-full text-[11px] font-bold ${s.paid ? "bg-emerald-600 text-white" : "bg-red-600 text-white"}` }, s.paid ? "✓ مدفوع" : "✗ غير مدفوع")
                        ),
                        React.createElement("td", { className: "p-3" },
                          React.createElement("a", { href: formatToWhatsApp(s.patientPhone), target: "_blank", className: "w-8 h-8 bg-green-100 text-green-600 rounded-full flex items-center justify-center hover:bg-green-200" }, "💬")
                        )
                      )
                    )
                  )
                )
              )
              : React.createElement("div", { className: "p-12 text-center" }, "😊 لا توجد جلسات اليوم")
            )
          ),

          // === إضافة مراجع - مع العمر بالشهر واليوم ===
          !loading && tab === "add-patient" && React.createElement("div", { className: "grid grid-cols-1 lg:grid-cols-[1.2fr_0.8fr] gap-4" },
            React.createElement("div", { className: "bg-white rounded-[20px] border border-slate-200 p-6 shadow-sm" },
              React.createElement("h2", { className: "font-bold text-[16px] mb-4" }, "➕ إضافة مريض جديد"),
              React.createElement("div", { className: "space-y-4" },
                React.createElement("div", { className: "grid grid-cols-1 md:grid-cols-2 gap-3" },
                  React.createElement("div", {},
                    React.createElement("label", { className: "text-[12px] font-bold" }, "الاسم *"),
                    React.createElement("input", { value: newPatient.name, onChange: (e) => setNewPatient({ ...newPatient, name: e.target.value }), placeholder: "أحمد محمد", className: "mt-1 w-full h-10 px-3 rounded-xl border text-[13px]" })
                  ),
                  React.createElement("div", {},
                    React.createElement("label", { className: "text-[12px] font-bold" }, "الموبايل *"),
