<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><style>

  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {

</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عيادة رقية للعلاج الطبيعي</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>body{font-family:'Tajawal',sans-serif;background:#f6f8fb}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useMemo} = React;
const firebaseConfig = {
  apiKey: "AIzaSyB3WLRLY5ZKn0TDG55uu7frulpEmj_tze0",
  authDomain: "eyada-tabiei.firebaseapp.com",
  projectId: "eyada-tabiei",
  storageBucket: "eyada-tabiei.firebasestorage.app",
  messagingSenderId: "10482510122",
  appId: "1:10482510122:web:abc123"
};
const DAY_NAMES = {0:"الأحد",1:"الاثنين",2:"الثلاثاء",3:"الأربعاء",4:"الخميس",5:"الجمعة",6:"السبت"};
const DAY_KEYS = ["saturday","sunday","monday","tuesday","wednesday","thursday"];
const DAY_LABELS = {"saturday":"السبت","sunday":"الأحد","monday":"الاثنين","tuesday":"الثلاثاء","wednesday":"الأربعاء","thursday":"الخميس"};
function toArabicDate(dateStr){
  try{
    const d = new Date(dateStr);
    return `${DAY_NAMES[d.getDay()]} ${d.getDate()} ${d.toLocaleDateString('ar-EG',{month:'long',year:'numeric'})}`;
  }catch{return dateStr}
}
function todayISO(){ return new Date().toISOString().split('T')[0]; }
function addDays(date, n){ const d=new Date(date); d.setDate(d.getDate()+n); return d; }
function App(){
  const [logged,setLogged]=useState(false);
  const [pass,setPass]=useState("");
  const [tab,setTab]=useState("today");
  const [patients,setPatients]=useState(()=>{
    try{return JSON.parse(localStorage.getItem("ruqayyah_clinic_v5")||"[]")}catch{return []}
  });
  const [therapists,setTherapists]=useState(()=>{
    try{return JSON.parse(localStorage.getItem("ruqayyah_therapists")||"[]")}catch{return [{id:"1",name:"د. رقية",phone:"0770",specialty:"علاج طبيعي"}]}
  });
  const [search,setSearch]=useState("");
  const [selectedPatient,setSelectedPatient]=useState(null);
  const [notif,setNotif]=useState(null);
  const [form,setForm]=useState({name:"",phone:"",address:"",injury:"",ageY:"",ageM:"",ageD:"",gender:"أنثى",therapistId:"1",weekdays:{},times:{}});
  useEffect(()=>{ localStorage.setItem("ruqayyah_clinic_v5", JSON.stringify(patients)); },[patients]);
  useEffect(()=>{ localStorage.setItem("ruqayyah_therapists", JSON.stringify(therapists)); },[therapists]);
  const showNotif=(msg,type="info")=>{setNotif({msg,type}); setTimeout(()=>setNotif(null),3000)};
  const isTherapistBusy=(therapistId,date,time)=>{
    for(const p of patients){
      for(const s of (p.sessions||[])){
        if(s.therapistId===therapistId && s.date===date){
          const [h1,m1]=s.time.split(":").map(Number);
          const [h2,m2]=time.split(":").map(Number);
          const diff=Math.abs((h1*60+m1)-(h2*60+m2));
          if(diff<60) return true;
        }
      }
    }
    return false;
  };
  const generateSessions=(weekdays,times,therapistId,patientName,injury)=>{
    const sessions=[];
    const start=new Date();
    const map={"saturday":6,"sunday":0,"monday":1,"tuesday":2,"wednesday":3,"thursday":4};
    const therapist = therapists.find(t=>t.id===therapistId);
    for(let i=0;i<60;i++){
      const d=addDays(start,i);
      const jsDay=d.getDay();
      if(jsDay===5) continue;
      const key=Object.keys(map).find(k=>map[k]===jsDay);
      if(key && weekdays[key]){
        const time=times[key]||"10:00";
        sessions.push({
          id: Math.random().toString(36).slice(2),
          date: d.toISOString().split('T')[0],
          dayName: DAY_NAMES[jsDay],
          time,
          status:"قادمة",
          paymentStatus:"لم يدفع",
          amount:0,
          attendance:"حاضر",
          therapistId,
          therapistName: therapist?.name||"",
          patientName,
          injuryType: injury
        });
      }
    }
    return sessions;
  };
  const handleAddPatient=()=>{
    if(!form.name){showNotif("اكتب اسم المراجع","error");return;}
    if(Object.keys(form.weekdays).length===0 || Object.values(form.weekdays).filter(Boolean).length===0){showNotif("اختار يوم واحد على الأقل","error");return;}
    const sessions=generateSessions(form.weekdays,form.times,form.therapistId,form.name,form.injury);
    for(const s of sessions){
      if(isTherapistBusy(s.therapistId,s.date,s.time)){
        showNotif(`المعالج ${s.therapistName} لديه جلسة في ${s.date} ${s.time}`,"error");
        return;
      }
    }
    const newPatient={
      id: Date.now().toString(),
      name:form.name, phone:form.phone, address:form.address, injury:form.injury,
      ageY:form.ageY, ageM:form.ageM, ageD:form.ageD, gender:form.gender,
      therapistId:form.therapistId,
      weekdays:form.weekdays, times:form.times,
      sessions,
      createdAt: new Date().toISOString()
    };
    setPatients([newPatient,...patients]);
    setForm({name:"",phone:"",address:"",injury:"",ageY:"",ageM:"",ageD:"",gender:"أنثى",therapistId:therapists[0]?.id||"1",weekdays:{},times:{}});
    showNotif("تمت إضافة المراجع وتوليد الجلسات حسب أيام الأسبوع","success");
    setTab("today");
  };
  const todaySessions = useMemo(()=>{
    const iso=todayISO();
    const list=[];
    patients.forEach(p=>{
      (p.sessions||[]).forEach(s=>{
        if(s.date===iso) list.push({...s,patientId:p.id,patientPhone:p.phone,patientName:p.name});
      });
    });
    return list.sort((a,b)=>a.time.localeCompare(b.time));
  },[patients]);
  const updateSession=(patientId,sessionId,field,value)=>{
    setPatients(prev=>prev.map(p=>{
      if(p.id!==patientId) return p;
      return {...p, sessions: p.sessions.map(s=> s.id===sessionId? {...s,[field]:value}:s)};
    }));
  };
  const filteredPatients = patients.filter(p=> p.name.includes(search) || p.phone.includes(search));
  if(!logged){
    return (
      <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-teal-600 to-cyan-700 p-4">
        <div className="bg-white rounded-[24px] p-8 w-full max-w-sm shadow-2xl">
          <h1 className="text-2xl font-extrabold text-center text-teal-700">عيادة رقية للعلاج الطبيعي</h1>
          <p className="text-center text-slate-500 mt-2">نظام إدارة الجلسات</p>
          <input type="password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="كلمة السر" className="mt-6 w-full border border-slate-200 rounded-xl p-3 text-center text-lg"/>
          <button onClick={()=>{if(pass==="0772") setLogged(true); else showNotif("كلمة السر خطأ","error")}} className="mt-4 w-full bg-teal-600 text-white rounded-xl py-3 font-bold">دخول</button>
          {notif && <div className="mt-3 text-center text-sm text-red-600">{notif.msg}</div>}
        </div>
      </div>
    );
  }
  return (
    <div className="min-h-screen">
      {notif && <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-[100] px-6 py-3 rounded-full text-white font-bold shadow-lg ${notif.type==="error"?"bg-red-500":"bg-emerald-600"}`}>{notif.msg}</div>}
      <header className="bg-white border-b sticky top-0 z-30">
        <div className="max-w-[1280px] mx-auto flex items-center justify-between p-4">
          <h1 className="font-extrabold text-xl text-teal-700">عيادة رقية للعلاج الطبيعي</h1>
          <div className="text-sm text-slate-500">{new Date().toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'})}</div>
        </div>
      </header>
      <div className="max-w-[1280px] mx-auto grid grid-cols-12 gap-4 p-4">
        <aside className="col-span-12 md:col-span-3">
          <div className="bg-white rounded-2xl p-3 space-y-2">
            {[
              {k:"today",l:"جلسات اليوم",c:todaySessions.length},
              {k:"add",l:"إضافة مراجع"},
              {k:"search",l:"البحث والمراجعين"},
              {k:"therapists",l:"إدارة الكادر"},
              {k:"reports",l:"التقارير"},
            ].map(item=>(
              <button key={item.k} onClick={()=>setTab(item.k)} className={`w-full flex justify-between items-center p-3 rounded-xl font-bold ${tab===item.k?"bg-teal-600 text-white":"bg-slate-50 text-slate-700"}`}>
                <span>{item.l}</span>{item.c!=null && <span className="bg-white/20 px-2 py-1 rounded-full text-xs">{item.c}</span>}
              </button>
            ))}
          </div>
        </aside>
        <main className="col-span-12 md:col-span-9">
          {tab==="today" && (
            <div className="space-y-4">
              <div className="bg-white rounded-2xl p-5">
                <h2 className="font-extrabold text-lg">جلسات اليوم - {DAY_NAMES[new Date().getDay()]} {todayISO()}</h2>
                <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mt-4">
                  <div className="bg-slate-50 rounded-xl p-3 text-center"><div className="font-extrabold text-xl">{todaySessions.length}</div><div className="text-xs">الإجمالي</div></div>
                  <div className="bg-emerald-50 rounded-xl p-3 text-center"><div className="font-extrabold text-xl text-emerald-600">{todaySessions.filter(s=>s.paymentStatus==="تم الدفع").length}</div><div className="text-xs">مدفوع</div></div>
                  <div className="bg-red-50 rounded-xl p-3 text-center"><div className="font-extrabold text-xl text-red-600">{todaySessions.filter(s=>s.paymentStatus==="لم يدفع").length}</div><div className="text-xs">غير مدفوع</div></div>
                  <div className="bg-amber-50 rounded-xl p-3 text-center"><div className="font-extrabold text-xl text-amber-600">{todaySessions.filter(s=>s.attendance==="معتذر").length}</div><div className="text-xs">معتذر</div></div>
                </div>
              </div>
              {new Date().getDay()===5 ? (
                <div className="bg-white rounded-2xl p-10 text-center"><div className="text-4xl">🕌</div><h3 className="mt-3 font-bold">اليوم الجمعة - عطلة العيادة</h3></div>
              ): todaySessions.length===0 ? (
                <div className="bg-white rounded-2xl p-10 text-center text-slate-500">لا توجد جلسات اليوم</div>
              ):(
                <div className="bg-white rounded-2xl overflow-auto">
                  <table className="w-full text-sm">
                    <thead className="bg-slate-50"><tr><th className="p-3 text-right">المراجع</th><th className="p-3">المعالج</th><th className="p-3">نوع الإصابة</th><th className="p-3">الدفع</th><th className="p-3">المبلغ د.ع</th><th className="p-3">الحضور</th><th className="p-3">وقت</th></tr></thead>
                    <tbody>
                      {todaySessions.map(s=>(
                        <tr key={s.id} className="border-t">
                          <td className="p-3 font-bold">{s.patientName}</td>
                          <td className="p-3">{s.therapistName}</td>
                          <td className="p-3">{s.injuryType||"-"}</td>
                          <td className="p-3"><button onClick={()=>updateSession(s.patientId,s.id,"paymentStatus",s.paymentStatus==="تم الدفع"?"لم يدفع":"تم الدفع")} className={`px-3 py-1 rounded-full text-xs font-bold ${s.paymentStatus==="تم الدفع"?"bg-emerald-600 text-white":"bg-red-100 text-red-700"}`}>{s.paymentStatus}</button></td>
                          <td className="p-3"><div className="flex gap-1"><input type="number" value={s.amount||""} onChange={e=>updateSession(s.patientId,s.id,"amount",parseInt(e.target.value)||0)} className="w-20 border rounded-lg p-1 text-center"/><span className="text-xs">د.ع</span></div></td>
                          <td className="p-3"><button onClick={()=>updateSession(s.patientId,s.id,"attendance",s.attendance==="حاضر"?"معتذر":"حاضر")} className={`px-3 py-1 rounded-full text-xs font-bold ${s.attendance==="معتذر"?"bg-amber-500 text-white":"bg-emerald-50 text-emerald-700"}`}>{s.attendance}</button></td>
                          <td className="p-3">{s.time}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          )}
          {tab==="add" && (
            <div className="bg-white rounded-2xl p-6 space-y-4">
              <h2 className="font-extrabold">إضافة مراجع - أيام الأسبوع فقط</h2>
              <div className="grid md:grid-cols-2 gap-3">
                <input value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="اسم المراجع" className="border rounded-xl p-3"/>
                <input value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})} placeholder="الهاتف" className="border rounded-xl p-3"/>
                <input value={form.address} onChange={e=>setForm({...form,address:e.target.value})} placeholder="العنوان" className="border rounded-xl p-3"/>
                <input value={form.injury} onChange={e=>setForm({...form,injury:e.target.value})} placeholder="نوع الإصابة" className="border rounded-xl p-3"/>
                <div className="flex gap-2">
                  <input value={form.ageY} onChange={e=>setForm({...form,ageY:e.target.value})} placeholder="سنة" className="border rounded-xl p-3 w-1/3"/>
                  <input value={form.ageM} onChange={e=>setForm({...form,ageM:e.target.value})} placeholder="شهر" className="border rounded-xl p-3 w-1/3"/>
                  <input value={form.ageD} onChange={e=>setForm({...form,ageD:e.target.value})} placeholder="يوم" className="border rounded-xl p-3 w-1/3"/>
                </div>
                <select value={form.therapistId} onChange={e=>setForm({...form,therapistId:e.target.value})} className="border rounded-xl p-3">
                  {therapists.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}
                </select>
              </div>
              <div className="flex gap-2 flex-wrap">
                <button onClick={()=>setForm({...form,weekdays:{sunday:true,tuesday:true,thursday:true},times:{sunday:"10:00",tuesday:"10:00",thursday:"10:00"}})} className="bg-slate-100 px-3 py-1 rounded-full text-sm">أحد-ثلاثاء-خميس</button>
                <button onClick={()=>setForm({...form,weekdays:{saturday:true,monday:true,wednesday:true},times:{saturday:"10:00",monday:"10:00",wednesday:"10:00"}})} className="bg-slate-100 px-3 py-1 rounded-full text-sm">سبت-اثنين-أربعاء</button>
                <button onClick={()=>setForm({...form,weekdays:{saturday:true,sunday:true,monday:true,tuesday:true,wednesday:true,thursday:true},times:{saturday:"10:00",sunday:"10:00",monday:"10:00",tuesday:"10:00",wednesday:"10:00",thursday:"10:00"}})} className="bg-slate-100 px-3 py-1 rounded-full text-sm">كل الأيام عدا الجمعة</button>
              </div>
              <div className="grid md:grid-cols-2 gap-3">
                {DAY_KEYS.map(k=>(
                  <div key={k} className={`border rounded-xl p-3 flex justify-between ${form.weekdays[k]?"border-teal-600 bg-teal-50":""}`}>
                    <label className="flex gap-2 font-bold"><input type="checkbox" checked={!!form.weekdays[k]} onChange={e=>setForm({...form,weekdays:{...form.weekdays,[k]:e.target.checked}})}/>{DAY_LABELS[k]}</label>
                    {form.weekdays[k] && <input type="time" value={form.times[k]||"10:00"} onChange={e=>setForm({...form,times:{...form.times,[k]:e.target.value}})} className="border rounded-lg p-1"/>}
                  </div>
                ))}
                <div className="border border-red-200 bg-red-50 rounded-xl p-3 text-red-700 font-bold">الجمعة - عطلة العيادة 🕌</div>
              </div>
              <button onClick={handleAddPatient} className="w-full bg-teal-600 text-white rounded-xl py-3 font-bold">حفظ وتوليد الجلسات</button>
            </div>
          )}
          {tab==="search" && (
            <div className="space-y-3">
              <div className="bg-white rounded-2xl p-4"><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="ابحث بالاسم أو الهاتف" className="w-full border rounded-xl p-3"/></div>
              {!selectedPatient ? filteredPatients.map(p=>(
                <div key={p.id} onClick={()=>setSelectedPatient(p)} className="bg-white rounded-xl p-4 cursor-pointer">
                  <div className="font-bold">{p.name}</div><div className="text-sm text-slate-500">{p.phone} - {p.address} - {p.injury}</div>
                </div>
              )) : (
                <div className="bg-white rounded-2xl p-6">
                  <button onClick={()=>setSelectedPatient(null)} className="bg-slate-100 px-4 py-1 rounded-full mb-3">رجوع</button>
                  <h3 className="font-bold text-xl">{selectedPatient.name}</h3>
                  <div className="mt-3 space-y-2">
                    {(selectedPatient.sessions||[]).map(s=>(
                      <div key={s.id} className="border rounded-xl p-3 flex justify-between">
                        <div><div className="font-bold">{toArabicDate(s.date)} - {s.time}</div><div className="text-xs">{s.therapistName} - {s.paymentStatus} - {s.amount} د.ع - {s.attendance}</div></div>
                        <div className="text-xs bg-slate-100 px-2 py-1 rounded-full">{s.status}</div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          )}
          {tab==="therapists" && (
            <div className="bg-white rounded-2xl p-6">
              <h2 className="font-bold mb-3">إدارة الكادر</h2>
              {therapists.map(t=><div key={t.id} className="border rounded-xl p-3 mb-2 flex justify-between"><span>{t.name}</span><button onClick={()=>setTherapists(therapists.filter(x=>x.id!==t.id))} className="text-red-600">حذف</button></div>)}
              <button onClick={()=>{const n=prompt("اسم المعالج"); if(n) setTherapists([...therapists,{id:Date.now().toString(),name:n,phone:"",specialty:""}])}} className="w-full bg-slate-900 text-white rounded-xl py-2 mt-3">إضافة</button>
            </div>
          )}
          {tab==="reports" && <div className="bg-white rounded-2xl p-6">عدد المراجعين: {patients.length} - إجمالي الجلسات: {patients.reduce((a,p)=>a+(p.sessions?.length||0),0)}</div>}
        </main>
      </div>
    </div>
  );
}
const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
